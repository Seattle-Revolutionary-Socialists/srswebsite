[package]
name = "axum-on-workers"
version = "0.1.0"
edition = "2021"

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.5", features = ["http", "axum"] }
worker-macros = { version = "0.8.5", features = ["http"] }

axum = { version = "0.8", default-features = false, features = ['json', 'macros', 'form'] }
tower-service = "0.3.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.7.0" }
tower = "0.5.3"
dotenvy = "0.15.7"
serde_json = "1.0.151"
octocrab = {
    version = "0.54.1",
    default-features = false,
    features = ["jwt-rust-crypto"]
}

jsonwebtoken = {
    version = "10",
    default-features = false,
    features = ["use_pem", "rust_crypto"]
}
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "FormData",
] }
http = "1"
ed25519-dalek = "3.0.0"
chrono = "0.4.45"
csv = "1.4.0"
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

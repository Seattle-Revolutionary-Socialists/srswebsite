name = "seattle-website"
main = "build/index.js"
compatibility_date = "2026-07-15"

[build]
command = "cargo install \"worker-build@^0.8\" && worker-build --release"

[dev]
ip = "0.0.0.0"
port = 1111
local_protocol = "http"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
GITHUB_APP_ID = "4521864"
GITHUB_INSTALLATION_ID = "152071081"
GITHUB_OWNER = "communistjesus"
GITHUB_REPO = "srsnewwebsite"
GITHUB_BASE_BRANCH = "main"

[observability]
enabled = true
head_sampling_rate = 1